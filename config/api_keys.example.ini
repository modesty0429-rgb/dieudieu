# 이 파일을 같은 폴더에 api_keys.ini 로 복사한 뒤 키를 넣으세요.
# api_keys.ini 는 .gitignore 에 들어 있어 GitHub 에 올라가지 않습니다. (키를 코드에 직접 쓰지 말 것)
#
# 기상청 단기예보 키 받는 법:
#   공공데이터포털(data.go.kr) → "기상청_단기예보 ((구)_동네예보) 조회서비스" 활용신청
#   → 마이페이지에서 일반 인증키(Decoding 또는 Encoding) 복사
#   (승인 직후에는 키가 등록되기까지 시간이 걸릴 수 있음)
# ============================================================

