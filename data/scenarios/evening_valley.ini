# ============================================================
# 시나리오: 해 질 녘 계곡 산불 (낮/밤 효과 확인용, 8단계)
# 오후 5시 산 아래 솔밭삼거리 근처에서 난 불이 남서풍을 타고 산 위로 올라온다.
# 발견이 100분 늦어 대피가 일몰(약 18:57) 무렵에 시작되므로
#   - 등산객은 어두워진 산길을 천천히 걸어야 하고 (보행 속도 60%)
#   - 진화 헬기는 해가 진 뒤 출동하지 못한다.
# [daylight] enabled = 0 으로 바꿔 실행하면 "낮이었다면"과 비교할 수 있다.
# 경로는 이 파일이 있는 폴더(data/scenarios) 기준
# ============================================================

[general]
name = evening_valley
output_dir = ../../output/evening_valley

[map]
elevation_file = ../maps/virtual_mountain_elev.asc
fuel_file      = ../maps/virtual_mountain_fuel.asc
fuel_models    = fuel_models.csv

[trails]
trail_file = ../trails/virtual_trails.txt
hiker_file = ../trails/virtual_hikers.txt

[time]
start_datetime      = 2026-04-05 17:00
duration_min        = 360      # [가정] 17:00 ~ 23:00
time_step_min       = 1
output_interval_min = 10

[ignition]
point1 = 93, 210, 0            # 솔밭삼거리 북동쪽 사면

[weather]
mode = fixed
fixed_temp_c        = 16       # [가정] 봄철 저녁
fixed_rh_pct        = 15       # [가정] 밤에도 건조한 상태가 이어짐
fixed_wind_speed_ms = 11       # [가정] 밤까지 이어지는 강풍
fixed_wind_dir_deg  = 225      # [가정] 남서풍 → 불이 북동쪽(산 위)으로
# [근거] 2025년 3월 경북 산불은 강풍 속 야간 확산으로 진화가 어려웠다는 보도가 있다.
#        밤에도 바람이 강하고 건조한 극단적 상황을 가정한 것이다.

[moisture]
initial_dead_moisture_pct = 7     # [가정]
live_moisture_factor      = 1.0
south_slope_drying_pct    = 2
timelag_min               = 60    # [근거] 1시간 지연 연료

[spread]
random_seed      = 42
spotting_enabled = 1
spot_base_prob   = 0.002       # [가정]
spot_mean_dist_m = 150         # [가정]

[evacuation]
caution_min      = 120         # [가정]
prepare_min      = 60          # [가정]
immediate_min    = 30          # [가정]
check_radius_m   = 500         # [가정]
notify_delay_min = 100         # [가정] 저녁이라 발견·신고가 늦어진 상황
safe_margin_min  = 30          # [가정]
danger_radius_m  = 60          # [가정]

[suppression]
firebreak_cells     = 60
firebreak_ready_min = 60
helicopters         = 3
heli_radius_cells   = 2
heli_interval_min   = 30
heli_effect_min     = 45

[montecarlo]
runs            = 100
wind_speed_sd   = 1.0
wind_dir_sd_deg = 15
rh_sd           = 5

[daylight]
enabled           = 1          # 1: 낮/밤 반영, 0: 반영 안 함 (비교용)
latitude_deg      = 37.5       # [가정] 가상 산의 위치 (중부 지방)
longitude_deg     = 127.0      # [가정]
utc_offset_h      = 9          # 한국 표준시 (UTC+9)
night_walk_factor = 0.6        # [가정] 밤에는 헤드랜턴에 의지해 낮 속도의 60%로 걷는다
heli_day_only     = 1          # [근거] 국내 산불 진화 헬기는 해가 지면 철수하고 일출 후 다시 투입된다
