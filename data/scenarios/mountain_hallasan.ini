# ============================================================
# 시나리오: 한라산 (백록담 주변 9 km × 9 km, 실제 지형)
# 지형: AWS Terrain Tiles (Mapzen/Tilezen terrarium, 한국은 주로 SRTM 30 m 기반), 확대 수준 13
# 연료: 산림청 임상도 반영
# mountain_builder.py 가 만든 파일 (다시 만들면 덮어씀)
# ============================================================

[general]
name = mountain_hallasan
output_dir = ../../output/mountain_hallasan

[map]
elevation_file = ../mountains/hallasan/elev.asc
fuel_file      = ../mountains/hallasan/fuel.asc
fuel_models    = fuel_models.csv

[trails]
trail_file = ../mountains/hallasan/trails.txt
hiker_file = ../mountains/hallasan/hikers.txt

[time]
start_datetime      = 2026-04-05 13:00
duration_min        = 600      # [가정] 10시간
time_step_min       = 1
output_interval_min = 10

[ignition]
point1 = 92, 206, 0         # 정상 남서쪽 약 2.4 km [가정]

[weather]
mode = file
file = ../weather/sample_spring_dry.csv
fixed_temp_c        = 18
fixed_rh_pct        = 25
fixed_wind_speed_ms = 6
fixed_wind_dir_deg  = 270

[moisture]
initial_dead_moisture_pct = 8     # [가정]
live_moisture_factor      = 1.0   # [가정]
south_slope_drying_pct    = 2     # [가정]
timelag_min               = 60    # [근거] 1시간 지연 연료

[spread]
random_seed      = 42
spotting_enabled = 1
spot_base_prob   = 0.002   # [가정]
spot_mean_dist_m = 150     # [가정]

[evacuation]
caution_min      = 120     # [가정]
prepare_min      = 60      # [가정]
immediate_min    = 30      # [가정]
check_radius_m   = 500     # [가정]
notify_delay_min = 10      # [가정]
safe_margin_min  = 30      # [가정]
danger_radius_m  = 60      # [가정]

[suppression]
firebreak_cells     = 60
firebreak_ready_min = 60
helicopters         = 3
heli_radius_cells   = 2
heli_interval_min   = 30
heli_effect_min     = 45

[montecarlo]
runs            = 100
wind_speed_sd   = 1.0
wind_dir_sd_deg = 15
rh_sd           = 5

[season]
season = none                # 계절은 GUI에서 고름 (기본: 기상 파일 그대로)
winter_snow_line_m = 1300      # 겨울에 이 고도(m) 이상은 눈 → 타지 않음, 걷기 느림 [가정] 산마다 다름
