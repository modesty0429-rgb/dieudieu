# 오류 메시지 확인용: 값이 잘못된 시나리오 (일부러 틀림)
[general]
name = test_bad_values

[map]
elevation_file = ../../mountains/bukhansan/elev.asc
fuel_file      = ../../mountains/bukhansan/fuel.asc
fuel_models    = ../fuel_models.csv

[time]
start_datetime = 2026-02-30 13:00     # 2월 30일은 없음
duration_min   = 360
time_step_min  = abc                  # 숫자가 아님

[ignition]
point1 = 98, 142

[weather]
mode = fixed
fixed_wind_speed_ms = 99              # 범위(0~40) 밖
fixed_wnd_dir_deg = 270               # 오타 → 경고

[evacuation]
caution_min   = 30                    # 순서가 거꾸로 (immediate < prepare < caution 이어야 함)
prepare_min   = 60
immediate_min = 120
