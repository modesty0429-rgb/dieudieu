# ============================================================
# 시나리오: 바람 없는 고정 기상 (비교 실험용)
# 바람이 없을 때 불이 거의 원형으로, 오르막 쪽으로 조금 더 빨리 번지는지 확인한다.
# ============================================================
[general]
name = calm_fixed_weather
output_dir = ../../output/calm_fixed_weather

[map]
elevation_file = ../maps/virtual_mountain_elev.asc
fuel_file      = ../maps/virtual_mountain_fuel.asc
fuel_models    = fuel_models.csv

[trails]
trail_file = ../trails/virtual_trails.txt
hiker_file = ../trails/virtual_hikers.txt

[time]
start_datetime      = 2026-04-05 13:00
duration_min        = 600
time_step_min       = 1
output_interval_min = 10

[ignition]
point1 = 180, 120, 0

[weather]
mode = fixed
fixed_temp_c        = 18     # [가정]
fixed_rh_pct        = 25     # [가정]
fixed_wind_speed_ms = 0      # 무풍
fixed_wind_dir_deg  = 270

[spread]
random_seed      = 42
spotting_enabled = 1         # 무풍이라 비화는 생기지 않음 (풍속 2 m/s 미만)
