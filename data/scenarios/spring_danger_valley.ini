# ============================================================
# 시나리오: 계곡 아래 발화 + 남서풍 강풍 + 매우 늦은 발견 (대피 위험 사례)
# 산 아래 솔밭삼거리 근처에서 난 불이 남서풍을 타고 산 위로 올라오는 상황.
# 사람이 없는 곳에서 불이 나 발견·신고가 140분 늦어져, 경보가 나갈 때는 이미
# 일부 등산객의 대피로가 막혀 있는 극단적 상황을 가정한다.
# 경로는 이 파일이 있는 폴더(data/scenarios) 기준
# ============================================================

[general]
name = spring_danger_valley
output_dir = ../../output/spring_danger_valley

[map]
elevation_file = ../maps/virtual_mountain_elev.asc
fuel_file      = ../maps/virtual_mountain_fuel.asc
fuel_models    = fuel_models.csv

[trails]
trail_file = ../trails/virtual_trails.txt
hiker_file = ../trails/virtual_hikers.txt

[time]
start_datetime      = 2026-04-12 12:00
duration_min        = 600      # [가정] 10시간
time_step_min       = 1
output_interval_min = 10

[ignition]
point1 = 93, 210, 0            # 솔밭삼거리 북동쪽 사면

[weather]
mode = fixed
fixed_temp_c        = 23       # [가정] 봄철 한낮
fixed_rh_pct        = 14       # [가정] 매우 건조
fixed_wind_speed_ms = 11       # [가정] 강풍
fixed_wind_dir_deg  = 225      # [가정] 남서풍 → 불이 북동쪽(산 위)으로

[moisture]
initial_dead_moisture_pct = 6     # [가정] 며칠째 건조
live_moisture_factor      = 1.0
south_slope_drying_pct    = 2
timelag_min               = 60    # [근거] 1시간 지연 연료

[spread]
random_seed      = 42
spotting_enabled = 1
spot_base_prob   = 0.002       # [가정]
spot_mean_dist_m = 150         # [가정]

[evacuation]
caution_min      = 120         # [가정]
prepare_min      = 60          # [가정]
immediate_min    = 30          # [가정]
check_radius_m   = 500         # [가정]
notify_delay_min = 140         # [가정] 발견·신고가 매우 늦어진 상황 (2시간 20분)
safe_margin_min  = 30          # [가정]
danger_radius_m  = 60          # [가정]

[suppression]
firebreak_cells     = 60
firebreak_ready_min = 60
helicopters         = 3
heli_radius_cells   = 2
heli_interval_min   = 30
heli_effect_min     = 45

[montecarlo]
runs            = 100
wind_speed_sd   = 1.0
wind_dir_sd_deg = 15
rh_sd           = 5
