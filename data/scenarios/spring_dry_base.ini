# ============================================================
# 시나리오: 봄철 건조 기본
# 표시: [근거] = 문헌·통계 근거가 있는 값, [가정] = 팀이 정한 값
# 경로는 이 파일이 있는 폴더(data/scenarios) 기준
# ============================================================

[general]
name = spring_dry_base
output_dir = ../../output/spring_dry_base

[map]
elevation_file = ../maps/virtual_mountain_elev.asc
fuel_file      = ../maps/virtual_mountain_fuel.asc
fuel_models    = fuel_models.csv

[trails]
trail_file = ../trails/virtual_trails.txt
hiker_file = ../trails/virtual_hikers.txt

[time]
start_datetime      = 2026-04-05 13:00
duration_min        = 360      # [가정] 6시간
time_step_min       = 1        # [가정] 1분 단위로 계산
output_interval_min = 10       # 10분마다 결과 저장

[ignition]
point1 = 120, 80, 0            # x, y, 발화 시각(분)

[weather]
mode = file                    # file: 아래 CSV 사용 / fixed: 아래 고정값 사용
file = ../weather/sample_spring_dry.csv
fixed_temp_c        = 18       # [가정]
fixed_rh_pct        = 25       # [가정]
fixed_wind_speed_ms = 6        # [가정]
fixed_wind_dir_deg  = 270      # [가정] 서풍

[moisture]
initial_dead_moisture_pct = 8     # [가정] 봄철 건조기 죽은 연료 수분
live_moisture_factor      = 1.0   # [가정] 계절 배율 (봄 기준 1.0)
south_slope_drying_pct    = 2     # [가정] 남향 사면은 햇빛을 많이 받아 더 건조
timelag_min               = 60    # [근거] 1시간 지연 연료(1-hour fuel)의 정의

[spread]
random_seed      = 42
spotting_enabled = 1
spot_base_prob   = 0.002       # [가정]
spot_mean_dist_m = 150         # [가정]

[evacuation]
caution_min    = 120           # [가정] 화선 도착 2시간 전부터 주의
prepare_min    = 60            # [가정] 1시간 전부터 대피 준비
immediate_min  = 30            # [가정] 30분 전부터 즉시 대피
check_radius_m = 500           # [가정] 등산객 주변 500 m 안의 불을 확인

[suppression]
firebreak_cells     = 40       # 방화선 칸 수
firebreak_ready_min = 60       # [가정] 방화선 완성까지 1시간
helicopters         = 2
heli_radius_cells   = 2
heli_interval_min   = 30       # [가정] 1회 왕복(급수 포함) 시간
heli_effect_min     = 45       # [가정] 살수 효과 지속 시간

[montecarlo]
runs            = 100
wind_speed_sd   = 1.0          # [가정] 풍속 예보 오차 (m/s)
wind_dir_sd_deg = 15           # [가정] 풍향 예보 오차 (도)
rh_sd           = 5            # [가정] 습도 예보 오차 (%)
