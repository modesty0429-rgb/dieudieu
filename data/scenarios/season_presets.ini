# ============================================================
# 계절 프리셋 — GUI의 "계절" 선택에서 사용
# 모든 값은 [가정]: 계절별 전형적인 날씨를 단순하게 흉내 낸 값이다.
#   - 국내 산불은 건조하고 바람이 강한 봄(3~5월)에 가장 많이 나고, 가을이 그다음이다. [근거: 일반적인 산불 통계 경향]
#   - live_moisture_factor: 확산 계산에 쓰는 실효 수분 배율 (잎·풀이 무성한 여름일수록 큼) [가정]
#   - initial_dead_moisture_pct: 시작 시 죽은 연료(낙엽 등) 수분 [가정]
#   - temp_c, rh_pct, wind_*: "직접 입력" 기상 모드의 기본값 [가정]
# ============================================================

[spring]
label = 봄 (3~5월, 건조·강풍)
live_moisture_factor = 1.0
initial_dead_moisture_pct = 8
temp_c = 18
rh_pct = 25
wind_speed_ms = 7
wind_dir_deg = 270
note = 산불이 가장 많은 계절. 새잎이 나기 전이라 숲이 건조함

[summer]
label = 여름 (6~8월, 습함)
live_moisture_factor = 1.6
initial_dead_moisture_pct = 15
temp_c = 28
rh_pct = 70
wind_speed_ms = 3
wind_dir_deg = 200
note = 장마와 무성한 잎 때문에 불이 잘 번지지 않음

[autumn]
label = 가을 (9~11월, 낙엽)
live_moisture_factor = 1.2
initial_dead_moisture_pct = 10
temp_c = 15
rh_pct = 40
wind_speed_ms = 4
wind_dir_deg = 315
note = 낙엽이 쌓이고 건조해지는 두 번째 산불 시기

[winter]
label = 겨울 (12~2월, 건조·추위)
live_moisture_factor = 1.1
initial_dead_moisture_pct = 9
temp_c = 2
rh_pct = 40
wind_speed_ms = 6
wind_dir_deg = 315
note = 건조하지만 기온이 낮아 확산이 느림
