# ============================================================
# 계절 프리셋 — GUI의 "계절" 선택에서 사용
#   - 국내 산불은 건조하고 바람이 강한 봄(3~5월)에 가장 많이 나고, 가을이 그다음이다. [근거: 일반적인 산불 통계 경향]
#   - 계절 날씨 특징 (장마는 다루지 않음):
#       봄 = 건조·강풍, 여름 = 덥고 습함, 가을 = 건조·낙엽, 겨울 = 건조·추위·눈
#   - "계절 평년 날씨" 기상 모드를 고르면 C 엔진(season.c)이 기상청 서울 평년값(1991~2020)을
#     바탕으로 하루 동안의 기온·습도·바람 변화를 직접 만든다. 아래 temp_c~wind_dir_deg 는
#     "직접 입력" 모드로 쓸 때의 오후 대표값이다. [가정]
#   - live_moisture_factor: 확산 계산에 쓰는 실효 수분 배율 (잎·풀이 무성한 여름일수록 큼) [가정]
#   - initial_dead_moisture_pct: 시작 시 죽은 연료(낙엽 등) 수분 [가정]
#   - date: 계절 대표 날짜 (일출·일몰 시각과 평년 기후 선택에 쓰임)
#   - snow_line_m: 이 높이 이상은 눈으로 덮여 타지 않음 (겨울만, 0이면 눈 없음) [가정]
# ============================================================

[spring]
label = 봄 (4월, 건조·강풍)
date = 2026-04-05
live_moisture_factor = 1.0
initial_dead_moisture_pct = 8
temp_c = 18
rh_pct = 30
wind_speed_ms = 7
wind_dir_deg = 270
snow_line_m = 0
note = 산불이 가장 많은 계절. 새잎이 나기 전이라 숲이 건조하고 바람이 강함

[summer]
label = 여름 (8월, 덥고 습함)
date = 2026-08-20
live_moisture_factor = 1.6
initial_dead_moisture_pct = 15
temp_c = 30
rh_pct = 62
wind_speed_ms = 3
wind_dir_deg = 225
snow_line_m = 0
note = 습도가 높고 잎이 무성해 불이 잘 번지지 않음

[autumn]
label = 가을 (10월, 건조·낙엽)
date = 2026-10-20
live_moisture_factor = 1.2
initial_dead_moisture_pct = 10
temp_c = 20
rh_pct = 40
wind_speed_ms = 4
wind_dir_deg = 315
snow_line_m = 0
note = 낙엽이 쌓이고 건조해지는 두 번째 산불 시기

[winter]
label = 겨울 (1월, 건조·추위·눈)
date = 2026-01-15
live_moisture_factor = 1.1
initial_dead_moisture_pct = 9
temp_c = 2
rh_pct = 40
wind_speed_ms = 5
wind_dir_deg = 315
snow_line_m = 600
note = 건조하지만 춥고, 높은 곳은 눈에 덮여 불이 붙지 않음 (눈길은 걷기도 느림)
